  <script>
    /* ==========================================================
       NADA DOCUMENT SEARCH
       ----------------------------------------------------------
       Nada تضيف المستندات الجديدة داخل هذه القائمة أو تستبدلها
       ببيانات يتم توليدها تلقائيًا من قاعدة بيانات الموقع.
       ========================================================== */

    const DOCUMENTS = [
// مثال على شكل البيانات — يمكن لـ Nada إضافة/تعديل العناصر:
      // {
      //   code: "RFI",
      //   name: "Request for Information",
      //   description: "شرح مستند RFI واستخدامه في المشروع.",
      //   url: "articles/rfi.html"
      // }
    ];

    const LINKEDIN_PROFILE = "https://www.linkedin.com/in/ahmed-khalaf-dc/";

    function normalizeSearch(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[أإآ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه");
    }

    function searchDocuments() {
      const input = document.getElementById("documentSearch");
      const results = document.getElementById("searchResults");
      const query = normalizeSearch(input.value);

      if (!query) {
        results.innerHTML = "";
        return;
      }

      const matches = DOCUMENTS.filter(doc => {
        const code = normalizeSearch(doc.code);
        const name = normalizeSearch(doc.name);
        const aliases = (doc.aliases || []).map(normalizeSearch);
        return code.includes(query) || name.includes(query) || aliases.some(a => a.includes(query));
      });

      if (matches.length > 0) {
        results.innerHTML = matches.map(doc => `
          <a class="search-result" href="${escapeHtml(doc.url || '#')}">
            <span class="code">${escapeHtml(doc.code || '')}</span>
            <strong>${escapeHtml(doc.name || '')}</strong>
            ${doc.description ? `<div>${escapeHtml(doc.description)}</div>` : ''}
          </a>
        `).join("");
        return;
      }

      /*
         لا يوجد شرح/بوست للمستند:
         يتم توجيه الباحث إلى LinkedIn الشخصي لأحمد خالد.
      */
      results.innerHTML = `
        <div class="search-empty">
          <p>المستند المطلوب غير متاح حاليًا في مكتبة Mostanad Academy.</p>
          <p>يمكنك البحث عنه في منشورات LinkedIn الشخصية.</p>
          <a class="btn btn-primary" href="${LINKEDIN_PROFILE}" target="_blank" rel="noopener">
            الانتقال إلى LinkedIn
          </a>
        </div>
      `;
    }

    document.getElementById("documentSearch").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchDocuments();
      }
    });

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

      
function toggleTheme(btn){


  document.body.classList.toggle("dark");


  // لو في دارك مود
  if(document.body.classList.contains("dark")){
    btn.innerText = "Light Mode";
    localStorage.setItem("theme","dark");
  } 
  else {
    btn.innerText = "Dark Mode";
    localStorage.setItem("theme","light");
  }
}


// تشغيل الحالة عند فتح الصفحة + تحديث النص
window.onload = function(){


  const btn = document.querySelector(".nav-link[onclick]");


  if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
    if(btn) btn.innerText = "Light Mode";
  } 
  else {
    if(btn) btn.innerText = "Dark Mode";
      localStorage.setItem("theme","light");
  }
}


  </script>
