function smartAnswer(text,isCorrect){
 const base=String(text).trim();
 const correctTail=' مع الالتزام بإجراء المشروع، والتحقق من الحالة والبيانات المرتبطة بالمستند قبل تنفيذ القرار وتوثيق الإجراء في السجل الرسمي.';
 const wrongTails=[
  ' لأن الهدف في هذه الحالة هو إنهاء الطلب بسرعة قدر الإمكان، ويمكن استكمال التحقق أو التوثيق لاحقًا إذا ظهرت مشكلة أثناء التنفيذ.',
  ' لأن تقليل الخطوات قد يكون أكثر عملية تحت ضغط الموقع، مع الاعتماد على المعلومات المتاحة في اللحظة الحالية بدل إيقاف العمل للتحقق الكامل.',
  ' لأن البيانات الموجودة أمامك تكفي لاتخاذ قرار مبدئي، ويمكن اعتبار الإجراء مقبولًا ما دام المستند يبدو مطابقًا من حيث الشكل أو الاسم.',
  ' لأن الحفاظ على سير العمل أهم من الرجوع في كل مرة إلى السجلات الرسمية، خصوصًا عندما يكون المطلوب عاجلًا ويحتاج الفريق إلى نتيجة سريعة.'
 ];
 let out=base+(isCorrect?correctTail:wrongTails[Math.floor(Math.random()*wrongTails.length)]);
 if(out.length<120) out+=' ويمكن التعامل مع أي تفاصيل إضافية أثناء المتابعة اليومية دون الحاجة إلى تعطيل القرار الحالي.';
 return out;
}

function gPuzzle(){const d=puzzles[G.q],items=[...d[1]].sort(()=>Math.random()-.5);app.innerHTML=`<section class="screen"><span class="tag">LEVEL 12 • PUZZLE • ${G.q+1}/10</span><h2>🧩 ${d[0]}</h2><p class="muted">اضغط على العناصر بالترتيب الصحيح. كل اختيار ينتقل إلى الخانة التالية.</p><div id="pSlots" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0">${d[1].map((_,i)=>`<div class="achievement" id="ps${i}">⬜ ${i+1}</div>`).join('')}</div><div id="pBtns" class="answers">${items.map(x=>`<button class="answer" onclick="gPickPuzzle(this,'${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div><div id="gf"></div>${gNav()}</section>`;window.pChosen=[];window.pTarget=d[1]}

<style>

<script>
(function(){
  /* ---------- Branding: SUPER DC ---------- */
  document.title = "SUPER DC";
  var brand = document.querySelector(".brand");
  if(brand) brand.innerHTML = '🚀 SUPER DC<small>مستند أكاديمي • أحمد خلف مرسي</small>';

  var WA = "https://wa.me/201156286464?text=" + encodeURIComponent("مرحباً أستاذ أحمد خلف مرسي 👋 أتواصل معك بخصوص لعبة SUPER DC (Document Control).");
  window.contactDeveloper = function(){ window.open(WA, "_blank", "noopener"); };

  /* ---------- WhatsApp floating button ---------- */
  var wa = document.createElement("button");
  wa.id = "waBtn"; wa.type = "button";
  wa.innerHTML = '<span style="font-size:18px">💬</span> تواصل مع المطور';
  wa.title = "واتساب: +20 115 628 6464";
  wa.onclick = window.contactDeveloper;
  document.body.appendChild(wa);

  /* ---------- Sound toggle ---------- */
  var stats = document.querySelector(".stats");
  var muted = localStorage.getItem("dcMuted") === "1";
  if(stats){
    var sb = document.createElement("button");
    sb.id = "soundBtn"; sb.type = "button";
    var paint = function(){ sb.textContent = muted ? "🔇 الصوت" : "🔊 الصوت"; };
    paint();
    sb.onclick = function(){ muted = !muted; localStorage.setItem("dcMuted", muted ? "1" : "0"); paint(); };
    stats.appendChild(sb);
  }

  /* ---------- FX canvas (confetti / sparks) ---------- */
  var cv = document.createElement("canvas"); cv.id = "dcFx"; document.body.appendChild(cv);
  var ctx = cv.getContext("2d"), parts = [], raf = null;
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  function burst(n, colors, power){
    for(var i=0;i<n;i++){
      parts.push({x:innerWidth/2,y:innerHeight*0.32,
        vx:(Math.random()-.5)*power, vy:(Math.random()-1)*power,
        s:4+Math.random()*6, c:colors[(Math.random()*colors.length)|0], a:1, r:Math.random()*6});
    }
    if(!raf) raf = requestAnimationFrame(loop);
  }
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i]; p.vy += .32; p.x += p.vx; p.y += p.vy; p.a -= .012; p.r += .12;
      if(p.a <= 0){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore();
    }
    if(parts.length) raf = requestAnimationFrame(loop); else { raf = null; ctx.clearRect(0,0,cv.width,cv.height); }
  }
  window.dcConfetti = function(big){ burst(big?150:45, ["#28a9ff","#f5c451","#32d583","#a98bff","#ffffff"], big?16:11); };

  /* ---------- Toast ---------- */
  var toast = document.createElement("div"); toast.id = "dcToast"; document.body.appendChild(toast);
  var tHide = null;
  window.dcToast = function(msg){
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(tHide); tHide = setTimeout(function(){ toast.classList.remove("show"); }, 1900);
  };

  /* ---------- Richer sound + effects (wraps original gTone) ---------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  function beep(freqs, type, dur){
    if(muted || !AC) return;
    try{
      actx = actx || new AC();
      if(actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime;
      freqs.forEach(function(f,i){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t0 + i*0.08);
        g.gain.setValueAtTime(.0001, t0 + i*0.08);
        g.gain.exponentialRampToValueAtTime(.14, t0 + i*0.08 + .02);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + i*0.08 + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + i*0.08); o.stop(t0 + i*0.08 + dur + .05);
      });
    }catch(e){}
  }
  window.dcSound = function(kind){
    if(kind === "good") beep([660,880,1180], "triangle", .22);
    else if(kind === "bad") beep([240,170], "sawtooth", .3);
    else if(kind === "win") beep([523,659,784,1047], "triangle", .28);
    else beep([880], "sine", .1);
  };

  var streak = 0;
  var praises = ["ممتاز! 💪","إجابة محترف 🔥","دقة عالية 🎯","Document Controller حقيقي 📁"];
  if(typeof window.gTone === "function"){
    var _tone = window.gTone;
    window.gTone = function(t){
      if(t === "good"){
        streak++;
        window.dcSound("good");
        window.dcConfetti(streak >= 3);
        window.dcToast(streak >= 3 ? ("🔥 سلسلة " + streak + " إجابات صحيحة!") : praises[(Math.random()*praises.length)|0]);
        var coins = document.getElementById("coins");
        if(coins && coins.parentElement){ coins.parentElement.classList.add("bump"); setTimeout(function(){ coins.parentElement.classList.remove("bump"); }, 260); }
      }else{
        streak = 0;
        window.dcSound("bad");
        //window.dcToast("راجع الشرح جيدًا 📘");
      }
      return;
    };
  }

  /* ---------- Level complete / certificate celebration ---------- */
  ["gComplete","gCertificate"].forEach(function(fn){
    if(typeof window[fn] === "function"){
      var orig = window[fn];
      window[fn] = function(){
        var r = orig.apply(this, arguments);
        window.dcSound("win"); window.dcConfetti(true);
        setTimeout(function(){ window.dcConfetti(true); }, 450);
        return r;
      };
    }
  });

  /* ---------- Keyboard shortcuts + answer number hints ---------- */
  document.addEventListener("keydown", function(e){
    if(/^[1-6]$/.test(e.key)){
      var btns = document.querySelectorAll(".answers .answer:not(.disabled)");
      var b = btns[parseInt(e.key,10) - 1];
      if(b) b.click();
    }
  });
  var mo = new MutationObserver(function(){
    document.querySelectorAll(".answers .answer").forEach(function(b,i){
      if(!b.querySelector(".key-hint") && i < 6){
        var k = document.createElement("span");
        k.className = "key-hint"; k.textContent = i + 1;
        b.appendChild(k);
      }
    });
    // rebrand hero title to SUPER DC
    var h1 = document.querySelector(".hero h1");
    if(h1 && !h1.dataset.superdc && /DOCUMENT CONTROL/i.test(h1.textContent)){
      h1.dataset.superdc = "1";
      h1.innerHTML = 'SUPER <span style="color:var(--blue)">DC</span><br><span style="font-size:.42em;color:var(--gold);letter-spacing:1px">DOCUMENT CONTROL: THE PROJECT</span>';
    }
    // developer contact button inside home screen
    var hero = document.querySelector(".hero .actions");
    if(hero && !hero.querySelector("[data-wa]")){
      var b = document.createElement("button");
      b.className = "secondary"; b.type = "button"; b.setAttribute("data-wa","1");
      b.textContent = "💬 تواصل مع المطور (واتساب)";
      b.onclick = window.contactDeveloper;
      hero.appendChild(b);
    }
  });
  var appEl = document.getElementById("app");
  if(appEl) mo.observe(appEl, {childList:true, subtree:true});

  // trigger once for the already-rendered home screen
  if(typeof window.gHome === "function") window.gHome();
})();
</script>
