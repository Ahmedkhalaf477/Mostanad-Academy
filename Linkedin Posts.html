<style>

/* ===== THEME ===== */
:root{
  --bg:#ffffff;
  --text:#0f172a;
  --card:#f1f5f9;
  --primary:#2563eb;
  --green:#22c55e;
}


body.dark{
  --bg:#0f172a;
  --text:#ffffff;
  --card:#1e293b;
}


body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.4s;
}


/* ===== DARK TEXT FIX ===== */
body.dark p,
body.dark h1,
body.dark h2,
body.dark h3,
body.dark li,
body.dark a{
  color:#fff !important;
 
}


/* ===== NAVBAR ===== */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  z-index:999;
  background:rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  transition:0.3s;
}


body.dark .navbar{
  background:rgba(15,23,42,0.9);
}


/* ===== NAV HOVER GREEN BORDER ===== */
.navbar .nav-link{
  padding:8px 12px;
  border-radius:10px;
  transition:0.3s;
  border:1px solid transparent;
}
/* NAVBAR HOVER COLOR */

.navbar .nav-link:hover{
  border:1px solid #00e1ffe8; /* اللون الجديد */
  color:#00d9fff8 !important;
}

/* ===== HERO ===== */
.hero{
  padding:120px 8% 60px;
}

.hero-box{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  align-items:center;
  justify-content:space-between;
}

.hero-text{
  flex:1;
  min-width:280px;
}


.hero-text h1{
  font-size:48px;
  font-weight:700;
}


.hero-text span{
  color:var(--primary);
}


.hero-card{
  flex:1;
  min-width:280px;
  background:var(--card);
  padding:25px;
  border-radius:15px;
}


/* ===== SECTIONS CENTER TITLES ===== */
section h2{
  text-align:center;
  margin-bottom:30px;
}


/* ===== CARDS ===== */
.card{
  background:var(--card);
  border:none;
  border-radius:15px;
  transition:0.3s;
}


.card:hover{
  transform:translateY(-6px);
}

/* HOVER EFFECT */
.service-card:hover{
  transform:scale(1.08);
}


.service-card:hover .overlay{
  background:rgba(0,0,0,0.25);
}


.service-card:hover h2,
.service-card:hover p{
  color:#38bdf3 /* أزرق */
  font-size:22px;
}


/* FIX TEXT IN DARK MODE */

body.dark .card p,
body.dark .card h3,
body.dark .card li,
body.dark .hero-card p,
body.dark .hero-card h3,
body.dark .hero-card li{
  color:#ffffff !important;
}
/* TITLES COLOR IN DARK MODE ONLY */


body.dark h1 span,
body.dark h2,
body.dark h3,
body.dark h1


{


  color:#38bdf3 !important;
}


/* ===== PARALLAX IMAGE ===== */


.parallax{
  height:350px;

  background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  position:relative;
}


/* طبقة غامقة احترافية */
.parallax::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}


/* استايل للدورات التدريبيه */
/* ===== COURSES ===== */
.course-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:40px;
}


.course-box{
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s ease;
  border:1px solid rgba(255,255,255,0.08);
  position:relative;
}


.course-box:hover{
  transform:translateY(-10px);
  box-shadow:0 10px 35px rgba(56,189,243,0.2);
}


.course-image{
  height:240px;
  background-size:cover;
  background-position:center;
}


.course-content{
  padding:25px;
}


.course-tag{
  display:inline-block;
  background:#00d8e7f1;
  color:#fff;
  font-size:16px;
  font-weight:600;
  padding:6px 12px;
  border-radius:30px;
  margin-bottom:15px;
}


.course-content h3{
  font-size:24px;
  margin-bottom:15px;
}


.course-content p{
  color:#cbd5e1;
  line-height:1.8;
  font-size:14px;
  margin-bottom:20px;
}


.course-btn{
  display:inline-block;
  padding:10px 18px;
  border-radius:12px;
  background:#38bdf3;
  color:#04070f;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}


.course-btn:hover{
  background:transparent;
  border:1px solid #38bdf3;
  color:#38bdf3;
}

.course-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  
  color: #ffffff;
}


/* يخلي آخر صف 2 في النص */
.course-box:nth-child(4) {
  grid-column: 1 / span 1;
}


.course-box:nth-child(5) {
  grid-column: 2 / span 1;
}


/* Responsive */
@media (max-width: 992px) {
  .course-grid {
    grid-template-columns: repeat(2, 1fr);
  }


  .course-box:nth-child(4),
  .course-box:nth-child(5) {
    grid-column: auto;
  }
}


@media (max-width: 600px) {
  .course-grid {
    grid-template-columns: 1fr;
  }
}




/* ===== CONTACT CENTER FIX ===== *
.contact{
  text-align:center;
  padding:40px;
  background:var(--card);
  border-radius:20px;
  margin-top:30px;
}




/* ===== FLOAT BUTTONS ===== */
.contact-float{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}




.contact-btn{
  padding:12px 14px;
  border-radius:12px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}





</style>
